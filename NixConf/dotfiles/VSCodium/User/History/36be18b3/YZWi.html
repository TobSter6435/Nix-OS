<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
<script type="module" src="./js/script.js" defer></script>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="brand">
      <span class="brand__eye" aria-hidden="true"></span>
      <h1 class="brand__name">Athena</h1>
    </div>
    <span class="brand__tag">lokales LLM</span>
  </header>

  <main class="chat" id="chat">

    <div class="msg msg--athena">
      <span class="msg__label">Athena</span>
      <p class="msg__text">Ich bin bereit. Was möchtest du wissen?</p>
    </div>

    <div class="msg msg--user">
      <span class="msg__label">Du</span>
      <p class="msg__text">Erzähl mir kurz, wer du bist.</p>
    </div>

    <div class="msg msg--athena">
      <span class="msg__label">Athena</span>
      <p class="msg__text">Ein Modell, gebaut aus Neugier &mdash; und etwas Trotz gegenüber HTML und CSS.</p>
    </div>

  </main>

  <form class="composer" id="composer">
    <textarea
      class="composer__input"
      id="input"
      placeholder="Frag Athena etwas…"
      rows="1"
      autocomplete="off"
    ></textarea>
    <button type="submit" class="composer__send" aria-label="Senden">
      <svg viewBox="0 0 24 24" class="composer__icon" aria-hidden="true">
        <path d="M3 11.5L21 3l-8.5 18-2.2-7.3L3 11.5z"/>
      </svg>
    </button>
  </form>

</div>
</body>
</html>
